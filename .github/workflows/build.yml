name: build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: Tests
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Test
        run: mvn clean test --errors --batch-mode
      - name: CodeCov
        uses: codecov/codecov-action@v4.0.1
        if: matrix.os == 'ubuntu-24.04' && matrix.java == 17 && github.repository == 'llorllale/cactoos-matchers'
        with:
          file: target/coverage/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Linters
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup Ruby 3.2.x
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.3
      - name: Install pdd, xcop
        run: |
          gem install pdd
          gem install xcop
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Puzzles
        run: pdd --file=/dev/null
      - name: Qulice
        run: mvn -P qulice clean install -DskipTests=true --errors --batch-mode
      - name: Site
        run: mvn -P site clean site --errors --batch-mode
